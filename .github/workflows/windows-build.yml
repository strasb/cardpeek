name: Build Windows artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 and install MinGW64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            pkgconf
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-curl

      - name: Build and install (64-bit, documented Makefile.win32 flow)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # Convert workspace path for MSYS2 tools and keep artifacts inside the workflow workspace.
          TARGET_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/windows-artifact/Cardpeek"

          ./clean.sh
          make -f Makefile.win32 DEPS=/mingw64 MPLATFORM=mingw64 TARGET="$TARGET_DIR"
          make install -f Makefile.win32 DEPS=/mingw64 MPLATFORM=mingw64 TARGET="$TARGET_DIR"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardpeek-windows-mingw64
          # upload-artifact packages this directory into a downloadable archive.
          path: ${{ github.workspace }}/windows-artifact/Cardpeek
          if-no-files-found: error
