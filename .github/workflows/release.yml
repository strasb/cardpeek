name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases and upload assets

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            autoconf make libglib2.0-dev libglib2.0-bin libgtk-3-dev \
            libgdk-pixbuf2.0-dev liblua5.2-dev libcurl4-openssl-dev \
            libssl-dev libpcsclite-dev libreadline-dev

      - name: Build
        run: |
          autoreconf --install
          ./configure
          make

      - name: Package Linux binary
        run: tar czf cardpeek-linux-x86_64.tar.gz cardpeek

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-asset
          path: cardpeek-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 with MinGW64 dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            pkgconf
            tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-curl

      - name: Build and install (64-bit)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          TARGET_DIR="$(cygpath -u "$GITHUB_WORKSPACE")/windows-artifact/Cardpeek"
          ./clean.sh
          make -f Makefile.win32 DEPS=/mingw64 MPLATFORM=mingw64 TARGET="$TARGET_DIR"
          make install -f Makefile.win32 DEPS=/mingw64 MPLATFORM=mingw64 TARGET="$TARGET_DIR"

      - name: Package Windows artifact
        shell: pwsh
        run: |
          Compress-Archive -Path "$env:GITHUB_WORKSPACE\windows-artifact\Cardpeek\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\cardpeek-windows-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-asset
          path: cardpeek-windows-x86_64.zip

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-asset

      - uses: actions/download-artifact@v4
        with:
          name: windows-release-asset

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            cardpeek-linux-x86_64.tar.gz
            cardpeek-windows-x86_64.zip
          generate_release_notes: true
          body: |
            ## ⚠️ Windows Runtime Notice
            The Windows binary is built automatically but may not run correctly yet.
            See [issue #1](https://github.com/ipamo/cardpeek/issues/1) for details.
